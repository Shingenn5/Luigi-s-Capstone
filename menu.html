<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menu | Luigi's Pizzeria</title>
    <link rel="stylesheet" href="./assets/bootstrap.min.css" />
  </head>
  <body>
    <header class="border-bottom py-3">
      <nav class="container d-flex flex-wrap justify-content-between align-items-center gap-3" aria-label="Main navigation">
        <a class="fs-3 fw-bold text-danger text-decoration-none" href="./index.html">Luigi's Pizzeria</a>
        <a class="btn btn-outline-dark py-2" href="./index.html">Back to home</a>
      </nav>
    </header>
    <main class="container py-5" id="main">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <p class="text-danger fw-semibold text-uppercase mb-2">Find your favorite</p>
          <h1 class="display-6 fw-bold">Our menu</h1>
          <p class="text-body-secondary mb-4">All prices are sample prices.</p>
          <h2 class="h4 mb-3">Pizzas</h2>
          <ul class="list-group">
            <li class="list-group-item p-4 d-flex justify-content-between align-items-center gap-3">
              <div><h3 class="h5 mb-1">Small Pizza</h3><p class="text-body-secondary mb-0">12-inch pizza</p></div>
              <span class="fw-semibold text-nowrap">$5.00</span>
            </li>
            <li class="list-group-item p-4 d-flex justify-content-between align-items-center gap-3">
              <div><h3 class="h5 mb-1">Medium Pizza</h3><p class="text-body-secondary mb-0">14-inch pizza</p></div>
              <span class="fw-semibold text-nowrap">$7.00</span>
            </li>
            <li class="list-group-item p-4 d-flex justify-content-between align-items-center gap-3">
              <div><h3 class="h5 mb-1">Large Pizza</h3><p class="text-body-secondary mb-0">18-inch pizza</p></div>
              <span class="fw-semibold text-nowrap">$9.00</span>
            </li>
          </ul>
        </div>
      </div>
    </main>
  </body>
</html>
