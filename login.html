<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Luigi's Pizzeria</title>
    <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/bootswatch-simplex.min.css" />
    <script src="./assets/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="./js/site.js"></script>
    <script type="module" src="./js/login.js"></script>
  </head>
  <body>
    <a class="visually-hidden-focusable position-absolute z-3 p-3 bg-white text-dark" href="#main">Skip to content</a>
    <header class="border-bottom py-3" id="siteHeader">
      <nav class="container d-flex flex-wrap justify-content-between align-items-center gap-3" aria-label="Main navigation">
        <a class="fs-3 fw-bold text-primary text-decoration-none" href="./index.html">Luigi's Pizzeria</a>
        <a class="btn btn-outline-dark py-2" href="./index.html">Back to home</a>
      </nav>
    </header>
    <main class="container py-5" id="main" tabindex="-1">
      <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5">
          <section class="card shadow-sm" aria-labelledby="loginTitle">
            <div class="card-body p-4">
              <h1 class="h3 mb-3" id="loginTitle">Customer login</h1>
              <form id="loginForm">
                <div id="registrationFields" hidden>
                  <div class="mb-3"><label class="form-label" for="firstName">First name</label><input class="form-control border-dark" id="firstName" autocomplete="given-name" maxlength="60" disabled /></div>
                  <div class="mb-3"><label class="form-label" for="lastName">Last name</label><input class="form-control border-dark" id="lastName" autocomplete="family-name" maxlength="60" disabled /></div>
                </div>
                <div class="mb-3">
                  <label class="form-label" id="identityLabel" for="loginIdentity">Email address</label>
                  <input class="form-control border-dark" id="loginIdentity" name="email" type="email" autocomplete="username" maxlength="254" aria-describedby="identityHint" required />
                  <div class="form-text" id="identityHint">Enter your email address.</div>
                </div>
                <div class="mb-4">
                  <label class="form-label" for="loginPassword">Password</label>
                  <input class="form-control border-dark" id="loginPassword" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" aria-describedby="passwordHint" required />
                  <div class="form-text" id="passwordHint">Use 8–128 characters. Spaces and password managers are welcome.</div>
                </div>
                <button class="btn btn-primary w-100 py-2" type="submit">Login</button>
                <p class="small mt-3 mb-0" id="loginStatus" role="status" aria-atomic="true"></p>
              </form>
              <div class="border-top mt-4 pt-3 text-center">
                <button class="btn btn-outline-dark py-2" id="registerMode" type="button">New customer? Create an account</button>
              </div>
              <p class="small text-body-secondary mt-3 mb-0">Customer accounts save your order history. Employee access is not available in this version.</p>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
