<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Employee orders | Luigi's Pizzeria</title>
    <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/bootswatch-simplex.min.css" />
    <script src="./assets/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="./js/site.js"></script>
    <script type="module" src="./js/employee.js"></script>
  </head>
  <body>
    <a class="visually-hidden-focusable position-absolute z-3 p-3 bg-white text-dark" href="#main">Skip to content</a>
    <header class="border-bottom" id="siteHeader"><nav class="container py-3" aria-label="Main navigation"><a href="./index.html">Luigi's Pizzeria</a></nav></header>
    <main class="container py-5" id="main" tabindex="-1">
      <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div><p class="text-primary fw-semibold text-uppercase mb-2">Employee workspace</p><h1 class="display-6 fw-bold">Pending orders</h1><p id="employeeIdentity" class="text-body-secondary">Checking employee access…</p></div>
        <div class="d-flex flex-wrap gap-3"><button class="btn btn-primary py-2" type="button" id="refreshOrders">Refresh orders</button><button class="btn btn-outline-dark py-2" type="button" id="employeeLogout">Employee logout</button></div>
      </div>
      <p class="text-body-secondary">Shows up to 50 oldest pending orders. Refresh to check for new orders.</p>
      <p class="small text-body-secondary">Viewing an order does not accept it or collect payment. Kitchen controls and preparation times are coming later.</p>
      <p id="employeeStatus" role="status" aria-atomic="true"></p>
      <section id="employeeOrders" aria-label="Pending order list" aria-busy="true"></section>
    </main>
  </body>
</html>
